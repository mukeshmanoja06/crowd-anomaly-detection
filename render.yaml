services:
  - type: web
    name: sentry-crowd-anomaly-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/sources
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
